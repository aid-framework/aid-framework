# The git tag is the source of truth for the version, so nothing here commits to
# main. The tag is gated on a successful CI run for the exact commit released:
# `workflow_run` hands us that run's head_sha.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: "Cut a release even if no releasable path changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A cancelled run could push a tag without its release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A failed CI run must never reach the release job.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      actions: read
    outputs:
      released: ${{ steps.publish.outputs.released }}
      version: ${{ steps.publish.outputs.version }}
      reason: ${{ steps.plan.outputs.reason || steps.resolve.outputs.reason }}
    steps:
      - name: Resolve the CI-validated commit
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$RUN_HEAD_SHA"
          else
            # A dispatch target is only releasable once CI has validated it.
            sha="$DISPATCH_SHA"
            validated=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
            if [ "$validated" -eq 0 ]; then
              {
                echo "resolved=false"
                echo "reason=no completed successful CI run for $sha; skipping release"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          {
            echo "resolved=true"
            echo "sha=$sha"
            echo "reason=CI validated $sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the validated commit
        if: steps.resolve.outputs.resolved == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        if: steps.resolve.outputs.resolved == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Decide whether to release
        id: plan
        if: steps.resolve.outputs.resolved == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          git tag --list > tags.txt

          last_tag=$(node scripts/version.mjs latest --config release.config.json --tags-file tags.txt)

          if [ -n "$last_tag" ]; then
            git diff --name-only --no-renames "$last_tag" "$TARGET_SHA" > changed-files.txt
            echo "changed paths since $last_tag:"
          else
            empty_tree=$(git hash-object -t tree /dev/null)
            git diff --name-only --no-renames "$empty_tree" "$TARGET_SHA" > changed-files.txt
            echo "no release tag yet; treating the whole history as the change set:"
          fi
          cat changed-files.txt

          force_flag=""
          if [ "${FORCE_RELEASE:-false}" = "true" ]; then
            force_flag="--force"
          fi

          node scripts/version.mjs decide \
            --config release.config.json \
            --tags-file tags.txt \
            --changed-files-file changed-files.txt \
            --github-output "$GITHUB_OUTPUT" \
            $force_flag > release-plan.json

          cat release-plan.json

      - name: Create tag and GitHub Release
        id: publish
        if: steps.plan.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.tag }}
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "released=true"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists; leaving it untouched"
          else
            git tag -a "$VERSION" "$TARGET_SHA" -m "$VERSION"
            git push origin "refs/tags/$VERSION"
          fi

          # The tag must point at the commit CI validated, never a newer tip.
          tagged=$(git rev-parse "$VERSION^{commit}")
          if [ "$tagged" != "$TARGET_SHA" ]; then
            echo "::error::tag $VERSION points at $tagged, expected $TARGET_SHA"
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; leaving it untouched"
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --verify-tag
          fi

      - name: Summarize
        if: always() && steps.resolve.outcome == 'success'
        shell: bash
        env:
          RESOLVED: ${{ steps.resolve.outputs.resolved }}
          SKIP_REASON: ${{ steps.resolve.outputs.reason }}
          SHA: ${{ steps.resolve.outputs.sha }}
          RELEASE: ${{ steps.plan.outputs.release }}
          VERSION: ${{ steps.plan.outputs.tag }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          {
            if [ "$RESOLVED" != "true" ]; then
              echo "### Release skipped"
              echo
              echo "\`$SKIP_REASON\`"
            elif [ "$RELEASE" = "true" ]; then
              echo "### Released \`$VERSION\`"
              echo
              echo "Validated commit: \`$SHA\`"
              echo
              echo "\`$REASON\`"
            else
              echo "### No release cut"
              echo
              echo "Validated commit: \`$SHA\`"
              echo
              echo "\`$REASON\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The automatic route into publishing. This job dispatches `publish.yml` rather than
  # calling it, because both registries trust the *dispatching* workflow's OIDC identity, and
  # because the `npmjs-publish` and `pypi-publish` environments admit deployments from `main`
  # only -- a run at a tag ref is refused before a single step executes. `workflow_dispatch` is
  # also the trigger GitHub still delivers for an event authored by `GITHUB_TOKEN`, which is
  # why a dispatch works here while `release: published` would never fire.
  #
  # `main` is the ref, so the published tree is `main`'s and not necessarily the tag's. That is
  # a real narrowing, forced by the environment rule: `detect` inside `publish.yml` refuses to
  # publish unless every manifest on the dispatched commit declares exactly this version, so a
  # stale tag cannot quietly publish newer code under an old version. It can still publish a
  # commit newer than the tag when that commit did not change any version.
  #
  # This job holds `actions: write` and nothing else; the release job holds `contents: write`
  # for the tag push. Neither job gets both.
  publish:
    name: publish
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    # This job never checks out the repository; it only calls the API. `gh` still
    # has to know which repository to call, and without a working tree it infers
    # that from `GH_REPO` alone -- otherwise every step here dies with
    # "fatal: not a git repository" the first time a releasable merge gets this far.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch the publish workflow on main
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # Look slightly back as well as forward: `createdAt` is assigned by the API, and
          # clock skew against this runner must not hide the run we are about to start.
          since="$(date -u -d '-5 seconds' +%Y-%m-%dT%H:%M:%SZ)"

          # `--ref main` is mandatory, not stylistic. Both environments refuse a tag ref, and
          # `version` must be explicit for the same reason: `main` is not the tag.
          gh workflow run publish.yml --ref main -f version="$VERSION"

          run_id=""
          for _ in $(seq 1 24); do
            run_id="$(gh run list \
              --workflow publish.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 20 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$since\")] | max_by(.createdAt) | .databaseId // empty")"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::dispatched publish.yml but no run for it appeared within two minutes."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched publish.yml for $VERSION at main: run $run_id."

      - name: Wait for the publish run
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set +e
          # Bounded on purpose. An environment with required reviewers legitimately holds the
          # run until someone approves; blocking forever would surface as a job timeout with
          # no explanation instead of as "waiting for approval".
          timeout 1800 gh run watch "$RUN_ID" --exit-status --interval 15 >/dev/null 2>&1
          code=$?
          set -e
          case "$code" in
            0)   echo "outcome=success" >> "$GITHUB_OUTPUT" ;;
            124) echo "outcome=pending" >> "$GITHUB_OUTPUT" ;;
            *)   echo "outcome=failure" >> "$GITHUB_OUTPUT"; exit 1 ;;
          esac

      - name: Summarize
        if: always() && steps.dispatch.outcome == 'success'
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          OUTCOME: ${{ steps.wait.outputs.outcome }}
        run: |
          {
            echo "### Publish dispatched for \`$VERSION\`"
            echo
            if [ -n "$RUN_URL" ]; then
              echo "Run: $RUN_URL"
              echo
            fi
            case "$OUTCOME" in
              success) echo "The publish run succeeded." ;;
              pending) echo "The publish run has not finished. That is most likely an environment approval that is still waiting; it is not a failure." ;;
              failure) echo "**The publish run failed.** Follow the run link above." ;;
              *) echo "The publish run reported no conclusion." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
