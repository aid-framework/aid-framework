# The `main` ruleset requires the `node`, `workflows`, `licenses` and `python`
# contexts, with strict_required_status_checks_policy enabled, so all four block a
# merge. The `evals` job below is deliberately *not* in that list and reports as
# advisory.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before lint: check-config imports @aid/spec from dist.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Coverage thresholds live in vitest.config.ts.
      - name: Test
        run: pnpm test:coverage

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtimes/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 3.11 deliberately: it is the floor declared in pyproject.toml and the
      # target of the mypy and ruff configs, so the floor stays proven.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runtimes/python/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy

  # Advisory, on purpose: `evals` is not a required context in the `main` ruleset.
  # It is the only job that covers `examples/support-copilot` -- the `python` job is
  # scoped to `runtimes/python` -- so the example's eval gate, lint and type check
  # live here rather than being implied by a green `python`.
  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/support-copilot
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            runtimes/python/pyproject.toml
            examples/support-copilot/pyproject.toml

      # The example depends on `aid-runtime-python` by name and that distribution is
      # not on an index, so the runtime is installed from the checkout first.
      - name: Install runtime
        run: python -m pip install -e "../../runtimes/python"

      - name: Install example
        run: python -m pip install -e ".[dev]"

      # The gate samples the model N times and compares the result with the stored
      # baseline under a tolerance, so it is statistical by design: a run that merely
      # differs from the baseline passes, and only a regression fails.
      #
      # `python -m app.generated.evals.classify_quality` is the production entry point
      # and targets the model the app is configured with, so running it here would
      # need a provider key. The offline gate -- the deterministic fake provider
      # answering the stored baseline, plus the falsifying case where the model gets
      # worse -- runs through the example's own harness below.
      - name: Eval gate
        run: pytest tests/test_eval_gate.py -v

      # The gate step above runs verbosely so its evidence is visible in CI; the rest
      # of the suite follows without the gate file, so it does not run twice.
      - name: Test
        run: pytest --ignore=tests/test_eval_gate.py

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/actionlint.tar.gz "$url"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Install shellcheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version | tail -n 1

      # actionlint exits 0 when it cannot find shellcheck, so the step above
      # asserts shellcheck is present.
      - name: Lint workflows
        run: actionlint -color -shellcheck=shellcheck

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Apache-2.0 project: a copyleft runtime dependency is hard to unwind later.
      - name: Check dependency licences
        run: pnpm lint:licenses
