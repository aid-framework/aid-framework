# The `main` ruleset requires the `node`, `workflows`, `licenses` and `python`
# contexts, with strict_required_status_checks_policy enabled, so all four block a
# merge. The `evals`, `e2e` and `conformance` jobs below are deliberately *not* in
# that list and report as advisory for a merge -- but `e2e` and `conformance` do gate
# *releases*: release.yml fires on `workflow_run` for this workflow's overall
# conclusion, so a red `e2e` or `conformance` stops the tag even though a merge can
# still proceed. `typescript` is advisory for the same reason and joins that list as
# soon as the ruleset names it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  OPENTOFU_VERSION: "1.13.2"

jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before lint: check-config imports @aid-framework/spec from dist.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Coverage thresholds live in vitest.config.ts.
      - name: Test
        run: pnpm test:coverage

  # The TypeScript runtime mirrors runtimes/python. It is its own job rather than extra
  # steps on `node` for two reasons: it is the only package that carries a project
  # reference of its own, and its dependency set (zod, @opentelemetry/api) is the one
  # place a new runtime dependency can enter.
  #
  # No database: the pgvector adapter resolves its driver lazily and the tests reach it
  # only through guards that never open a connection, so this job needs no Postgres
  # service (D2). The runtime's per-module coverage floors live in vitest.config.ts and
  # are enforced by the `node` job, which runs coverage across the whole workspace.
  #
  # Advisory on purpose: `typescript` is not yet a required context in the `main`
  # ruleset (see the header), so this job reports without blocking a merge.
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the runtime through its project reference, so a declaration that does not
      # compile fails here on its own rather than only inside the full solution build.
      - name: Build
        run: pnpm build

      # This is the step that proves the runtime's tests are typechecked at all: they are
      # collected by tsconfig.tests.json, and without an entry there a type error in a
      # runtime test would pass unnoticed. It runs after Build because that config
      # imports @aid-framework/ir and @aid-framework/spec from dist.
      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.tests.json

      - name: Test
        run: pnpm exec vitest run runtimes/typescript

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtimes/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 3.11 deliberately: it is the floor declared in pyproject.toml and the
      # target of the mypy and ruff configs, so the floor stays proven.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runtimes/python/pyproject.toml

      # The `deepagents` extra is installed here so the optional backend is covered by
      # the same gate as the native loop: the engine's own tests and its four
      # conformance cases would otherwise be skipped rather than checked. It stays
      # network-free at test time -- no API key, no live provider, no LangSmith -- and
      # it must not be required for the native runtime to install or run.
      - name: Install
        run: python -m pip install -e ".[dev,deepagents]"

      - name: Test
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy

  # Advisory, on purpose: `evals` is not a required context in the `main` ruleset.
  # It is the only job that covers `examples/support-copilot` -- the `python` job is
  # scoped to `runtimes/python` -- so the example's eval gate, lint and type check
  # live here rather than being implied by a green `python`.
  evals:
    name: evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/support-copilot
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            runtimes/python/pyproject.toml
            examples/support-copilot/pyproject.toml

      # The example depends on `aid-runtime-python` by name and that distribution is
      # not on an index, so the runtime is installed from the checkout first.
      - name: Install runtime
        run: python -m pip install -e "../../runtimes/python"

      - name: Install example
        run: python -m pip install -e ".[dev]"

      # The gate samples the model N times and compares the result with the stored
      # baseline under a tolerance, so it is statistical by design: a run that merely
      # differs from the baseline passes, and only a regression fails.
      #
      # `python -m app.generated.evals.classify_quality` is the production entry point
      # and targets the model the app is configured with, so running it here would
      # need a provider key. The offline gate -- the deterministic fake provider
      # answering the stored baseline, plus the falsifying case where the model gets
      # worse -- runs through the example's own harness below.
      - name: Eval gate
        run: pytest tests/test_eval_gate.py -v

      # The gate step above runs verbosely so its evidence is visible in CI; the rest
      # of the suite follows without the gate file, so it does not run twice.
      - name: Test
        run: pytest --ignore=tests/test_eval_gate.py

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy

  # The guard-step example (`examples/guarded-reply`) covers the one enforcement path no
  # other example reaches: an `output`-stage guardrail for which a pipeline `guard` step
  # is the *only* enforcement. It is a second app rather than a second route in
  # `support-copilot` because `support-copilot` streams, and an output-stage guardrail is
  # refused on a streaming deployment.
  #
  # It follows `e2e`'s pattern -- regenerate, prove byte-identity, then run -- because the
  # committed tree is generated code: without the regeneration step a hand edit would
  # compile and pass while no longer being what the emitter produces.
  guarded-reply:
    name: guarded-reply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: node
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            runtimes/python/pyproject.toml
            examples/guarded-reply/pyproject.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The example depends on `aid-runtime-python` by name and that distribution is not
      # on an index, so the runtime is installed from the checkout first. The example's
      # `[dev]` extra is what supplies pytest, ruff and mypy -- without it the steps below
      # fail with "command not found" rather than a test failure.
      - name: Install the runtime
        run: python -m pip install -e runtimes/python

      - name: Install the example
        working-directory: examples/guarded-reply
        run: python -m pip install -e ".[dev]"

      - name: Regenerate
        run: pnpm generate:guarded

      # A diff here means the committed tree is not what the emitter produces, which is
      # the one thing a generated example must never be.
      - name: Assert the committed tree is what the emitter produces
        run: git diff --exit-code -- examples/guarded-reply

      - name: Test
        working-directory: examples/guarded-reply
        run: pytest

      - name: Lint
        working-directory: examples/guarded-reply
        run: ruff check .

      - name: Format check
        working-directory: examples/guarded-reply
        run: ruff format --check .

      - name: Typecheck
        working-directory: examples/guarded-reply
        run: mypy

  # The only job that runs the *generated* app rather than the generator's outputs as
  # text: it regenerates the example with the shipped `aid` binary, asserts the result is
  # byte-identical to what is committed, then boots the regenerated tree and answers a
  # real request over a real socket. Generated code that looks plausible but cannot run is
  # the failure mode unit tests are blind to.
  #
  # `needs: node` because that job runs the codegen tests; booting generated code whose
  # own tests already failed would only add noise.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: node
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            runtimes/python/pyproject.toml
            examples/support-copilot/pyproject.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The example depends on `aid-runtime-python` by name and that distribution is not
      # on an index, so the runtime is installed from the checkout first. Installing the
      # committed example then provides fastapi and uvicorn -- the runtime deliberately
      # does not depend on a web framework. The regenerated copy is imported from its own
      # directory, and `scripts/e2e-example.mjs` asserts that it was the one imported.
      - name: Install the runtime and the example's dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e runtimes/python
          python -m pip install -e examples/support-copilot

      # Regenerate, compare byte for byte, boot, and hit the endpoint.
      - name: End to end
        run: pnpm e2e

      # The TypeScript target makes the same three claims against its own example. It needs
      # nothing beyond the workspace install above -- no PyPI package, no web framework --
      # which is why it joins this job rather than getting one of its own.
      - name: End to end (TypeScript)
        run: pnpm e2e:ts

      # The root `pnpm test` is a single workspace run and the example names its suite
      # directory `tests/`, so vitest does not collect it. This step is the only caller,
      # and `examples/support-copilot-ts/scripts/run-tests.mjs` asserts the exact number
      # of passing tests, so it cannot pass by running none of them.
      - name: Example app tests (TypeScript)
        run: pnpm --filter support-copilot-ts-example test

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # GitHub's release-asset CDN intermittently answers 504; --retry-all-errors
          # retries that class, which a plain -f would surface as a job failure.
          curl --retry 5 --retry-delay 3 --retry-all-errors -sSfL -o /tmp/actionlint.tar.gz "$url"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Install shellcheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version | tail -n 1

      # actionlint exits 0 when it cannot find shellcheck, so the step above
      # asserts shellcheck is present.
      - name: Lint workflows
        run: actionlint -color -shellcheck=shellcheck

  # The provider modules are generated HCL, and `infra-modules.test.ts` asserts every
  # committed fixture is byte-for-byte what the emitter produces -- so a module that stops
  # validating also fails a unit test. Each env root is validated separately: a plan that
  # is wrong on one cloud fails for a reason the other cloud's fixture cannot reveal.
  # Advisory for a merge, like `typescript`: it gates nothing until the ruleset names it.
  tofu:
    name: tofu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install OpenTofu
        run: |
          set -euo pipefail
          url="https://github.com/opentofu/opentofu/releases/download/v${OPENTOFU_VERSION}/tofu_${OPENTOFU_VERSION}_linux_amd64.zip"
          curl --retry 5 --retry-delay 3 --retry-all-errors -sSfL -o /tmp/tofu.zip "$url"
          sudo unzip -q -o /tmp/tofu.zip -d /usr/local/bin tofu
          tofu version

      # -backend=false: validation needs the provider schema, not state. Each fixture is
      # an env root exactly as a project would hold one, so this also proves the
      # documented `source` path resolves.
      - name: Init the fixture env roots
        working-directory: packages/cli/test/fixtures/infra/envs
        run: |
          set -euo pipefail
          for env in dev aws-kb gcp-dev gcp-kb; do
            ( cd "$env" && tofu init -backend=false -input=false -no-color )
          done

      - name: Validate the generated modules
        working-directory: packages/cli/test/fixtures/infra/envs
        run: |
          set -euo pipefail
          for env in dev aws-kb gcp-dev gcp-kb; do
            echo "::group::$env"
            ( cd "$env" && tofu validate -no-color )
            echo "::endgroup::"
          done

      # One module path holds one cloud's bytes, so the GCP runtime fixture keeps its own
      # tree beside its root. Validating it through the AWS root above would check the AWS
      # module a second time and never the reasoning-engine resources at all.
      - name: Validate the GCP runtime fixture
        working-directory: packages/cli/test/fixtures/infra/gcp-runtime/envs/dev
        run: |
          set -euo pipefail
          tofu init -backend=false -input=false -no-color
          tofu validate -no-color

  # The CDK construct is a constant too, and `infra-modules.test.ts` asserts the committed
  # fixture is byte-for-byte what the emitter produces. That proves the file has not
  # drifted; it cannot prove `cdk synth` still accepts it. CDK validates a construct at
  # synth, not at import, so a library bump can break it without this repo changing --
  # which is why the pinned CLI and `aws-cdk-lib` move together.
  # Advisory for a merge, like `typescript` and `tofu`: it gates nothing until the ruleset
  # names it.
  cdk:
    name: cdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/cli/test/fixtures/infra/package-lock.json

      # The dependencies live at the fixture root, not beside the app: the construct
      # resolves `aws-cdk-lib` from its own path upward.
      - name: Install the fixture's CDK toolchain
        working-directory: packages/cli/test/fixtures/infra
        run: npm ci --no-audit --no-fund

      # `cdk synth` exits 0 for an empty stack, so the fixture app asserts the resource
      # shape itself. A construct that emits nothing fails here rather than passing green.
      - name: Synthesise the generated construct
        working-directory: packages/cli/test/fixtures/infra/cdk
        run: node ../node_modules/aws-cdk/bin/cdk synth --no-color

      # Synth writes a `.messages.json` per stack when CDK's own validation objects. The
      # fixture is valid when that file does not exist at all, so its presence is the
      # failure -- exiting 0 is not enough.
      - name: Assert the construct produced no validation messages
        working-directory: packages/cli/test/fixtures/infra/cdk
        run: |
          set -euo pipefail
          if compgen -G "cdk.out/*.messages.json" > /dev/null; then
            echo "cdk synth reported validation messages:"
            cat cdk.out/*.messages.json
            exit 1
          fi

  # release.yml tags whatever commit a releasable merge produces, and publish.yml only
  # publishes a tag whose manifests declare that exact version. Nothing used to check
  # the two agreed, so a releasable merge without a stamp minted an empty release and
  # both publish jobs skipped -- four times in a row before it was noticed. Checking
  # here, on the pull request, makes the failure land on the author instead of on main.
  release-plan:
    name: release-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # version.mjs has no dependencies, so this needs no install step.
      - name: Manifests declare the version this PR would release
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          # The default checkout refspec does not guarantee a remote-tracking ref for
          # the base branch, and the diff range needs one.
          git fetch --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git tag --list > tags.txt
          git diff --name-only --no-renames \
            "$(git merge-base "origin/$BASE_REF" HEAD)" HEAD > changed-files.txt

          node scripts/version.mjs decide \
            --config release.config.json \
            --tags-file tags.txt \
            --changed-files-file changed-files.txt \
            --github-output plan.out > release-plan.json
          cat release-plan.json

          # Same output contract release.yml consumes, so the two cannot disagree
          # about which version a change set produces.
          release=$(sed -n 's/^release=//p' plan.out)
          # The output carries the tag form (v0.1.52); verify takes the bare semver.
          version=$(sed -n 's/^version=//p' plan.out)

          if [ "$release" != "true" ]; then
            echo "no release for this change set; nothing to stamp"
            exit 0
          fi

          node scripts/version.mjs verify --version "${version#v}" --config release.config.json

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Apache-2.0 project: a copyleft runtime dependency is hard to unwind later.
      - name: Check dependency licences
        run: pnpm lint:licenses

  # Advisory for a merge, gating for a release. One shared corpus of cases at the
  # repository root, one thin runner per runtime, and a diff of the two verdict sets:
  # the corpus is the contract, the runners are its two consumers, and a divergence in
  # either direction fails the job.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: node
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runtimes/python/pyproject.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The TypeScript runner imports the compiled runtime, not the sources.
      - name: Build
        run: pnpm build

      - name: Install the Python runtime
        run: python -m pip install -e runtimes/python

      # Each runner resolves the corpus itself and prints the path it resolved, so the
      # log names the file both runtimes agreed on instead of asserting it in prose. An
      # empty or unreadable corpus exits non-zero in both: a run that checks nothing is
      # a failure, not a vacuous pass.
      - name: Conformance (python)
        run: python runtimes/python/tests/conformance/test_conformance.py "$RUNNER_TEMP/python-verdicts.json"

      - name: Conformance (typescript)
        run: node runtimes/typescript/test/conformance/run.ts "$RUNNER_TEMP/typescript-verdicts.json"

      # The novel step. It requires equal populations, rejects an id emitted by only one
      # runtime, rejects unknown and duplicated ids, and rejects any field that differs
      # in a single digit -- so a case one runtime silently stopped checking fails here
      # rather than passing quietly.
      - name: Diff the runtimes' verdicts
        run: >-
          node runtimes/typescript/test/conformance/run.ts --compare
          "$RUNNER_TEMP/python-verdicts.json" "$RUNNER_TEMP/typescript-verdicts.json"
