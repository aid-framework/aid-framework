# Publishes the VitePress site in `site/`, which renders the Markdown under `docs/`, to
# GitHub Pages. Pages must be configured with "GitHub Actions" as the source; this
# workflow is then the only publisher, and a merge to `main` is what updates the live site.
#
# The build also runs on pull requests, where it is deliberately just a build: a broken
# page, a dead link, a stale generated reference, a page that inherits the site tagline
# instead of describing itself, or a page that renders inaccessible content fails the PR
# before it reaches `main`.
# Configure, upload and deploy are skipped there, so a PR run needs no Pages permission.
#
# This is not a required check and it is not part of the release gate. The site can be
# rebuilt from any commit, so a Pages outage must not block a merge or block a tag.
name: Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR builds are cancelled; deployments are not. Cancelling a run that is midway
# through deploying can leave the environment reporting a deployment that never finished,
# so the deploy leg keeps its own group and only one main-branch run is ever in flight.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No tags are fetched: the version comes from the shipped manifests, which are part of
      # the checkout, so a shallow clone reports the same version as a full one.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when a committed reference page no longer matches the source it is derived
      # from. It reads source rather than `dist`, so no build is needed first.
      - name: Check generated reference
        run: pnpm docs:check

      - name: Build site
        run: pnpm docs:build

      # Reads the emitted HTML rather than the Markdown, so it sees what a crawler sees. A
      # page that inherits the site tagline is reported as having no description, because
      # the tag is always present and only the text tells you whether an author wrote one.
      - name: Check page metadata
        run: pnpm docs:head

      # Reads the emitted HTML rather than the Markdown, so it catches the links VitePress
      # generates as well as the ones authors type: a sidebar entry for a page that does not
      # exist, an absolute path outside `/aid-framework/`, or a fragment naming no heading.
      # Runs on pull requests too, which is where a dead link should fail.
      - name: Check internal links
        run: pnpm docs:links

      # Structural accessibility and self-containment on the same dist: landmarks, skip
      # links, accessible names, unique ids, no third-party subresources or embeds, and a
      # local search index. It reads static HTML, so it cannot see the DOM a component
      # renders after hydration, cannot compute contrast and cannot drive the keyboard.
      - name: Check accessibility
        run: pnpm docs:a11y

      # The behaviour check drives the Google Chrome the runner image already ships, rather
      # than Playwright's Chromium. Playwright's Chromium needs `--with-deps`, which shells
      # out to apt and resolves through this runner's `azure.archive.ubuntu.com` mirror; when
      # that mirror is down the job dies in apt and never reaches the browser, which reads as
      # a Chromium problem and is not one. The installed Chrome needs none of that, and
      # `A11Y_BROWSER_CHANNEL` already exists to select it, so nothing is fetched here.
      - name: Confirm Chrome is available
        run: google-chrome --version

      # The part `docs:a11y` cannot do: loads every emitted page in Chrome, runs axe over
      # the hydrated DOM in light and dark, and drives the skip link, search dialog, mobile
      # navigation and appearance switch from the keyboard.
      - name: Check accessibility in a browser
        env:
          A11Y_BROWSER_CHANNEL: chrome
        run: pnpm docs:browser

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    name: verify-live
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The check reads the version from the shipped manifests and then fetches the page, so
      # it needs a checkout and a Node runtime and nothing else -- no dependency install.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Confirms the page a reader actually gets reports the release this commit declares.
      # Deliberately not a required check: it runs after `deploy` on main, so it reports on a
      # publication that already happened rather than blocking a merge. It retries for ~10
      # minutes because GitHub Pages sits behind a CDN with `max-age=600`.
      - name: Assert the published site reports the declared version
        run: node site/scripts/check-live-version.mjs
