# Declare an ecosystem only once the manifest it reads exists.
# GitHub reads this file from the default branch only, so it is inert until merged.

version: 2

updates:
  # The root package.json is the pnpm workspace manifest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # The Python runtime installs with `pip install -e .[dev,deepagents]` in every job and
  # has no lockfile, so `pip` is the ecosystem that reads the manifest CI actually uses.
  # `uv` would need a committed `uv.lock` that nothing verifies.
  - package-ecosystem: pip
    directory: /runtimes/python
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - python
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # `deepagents` is an exact pin on purpose: the IR gate requires a pinned
    # `engineVersion`, and `aid_runtime.agents.engine.DEEPAGENTS_PIN` must move with it in
    # the same commit. A bot PR that bumps only the manifest fails that gate, so the bump
    # stays a deliberate, human change.
    ignore:
      - dependency-name: deepagents
