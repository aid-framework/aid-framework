specVersion: "0.7"
project:
  name: screening
  namespace: acme.screening
  description: A decision model gates the input stage before a prompt is spent on it.
  targets: [py-fastapi]
decisions:
  topical:
    provider: typesafe
    model: jev-1.14.0
    type: choice
    instructions: Is this message about our product
    criteria:
      product: A question about features, pricing, or usage
      billing: A question about an invoice or a refund
      off_topic: Anything unrelated
guardrails:
  relevance:
    stages: [input]
    decision: topical
    onDecision:
      product: allow
      billing: allow
      off_topic: block
    minConfidence: 0.6
    onFail:
      message: This request is outside the assistant's scope.
      log: true
