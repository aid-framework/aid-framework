specVersion: "0.25"
profile: enterprise
project:
  name: agent-desk
  namespace: acme.agents
  description: An enterprise-profile agent whose deployment pins its region and audit sink.
  targets: [py-fastapi]
types:
  TicketClassification:
    kind: struct
    fields:
      category:
        type: string
        required: true
      summary:
        type: string
        required: true
models:
  triage:
    provider: openai
    modelId: gpt-4o-mini
    capabilities: [json-schema]
    apiKeyEnv: OPENAI_API_KEY
prompts:
  classify_ticket:
    version: 1
    model: triage
    template: |
      Classify the support ticket below.
      Subject: {{subject}}
    variables:
      subject:
        type: string
        required: true
    output:
      kind: structured
      schema: TicketClassification
guardrails:
  outbound:
    stages: [output]
    policies: [pii-detect]
    action: block
    onFail:
      message: The response was rejected by the output guardrail.
      log: true
deployments:
  prod:
    target: container
    cloud: aws
    region: eu-central-1
    audit:
      sink: cloudwatch
      retentionDays: 400
    secrets: [OPENAI_API_KEY]
pipelines:
  handle_ticket:
    description: Classify an inbound ticket.
    trigger:
      http:
        method: post
        path: /tickets
    steps:
      - generate:
          prompt: classify_ticket
          input:
            subject: "{{event.subject}}"
          as: classification
