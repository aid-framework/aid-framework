specVersion: "0.9"
project:
  name: route
  namespace: acme.route
  description: A decision names the arm a pipeline runs, and the answer is bound.
  targets: [py-fastapi]
types:
  Answer:
    kind: struct
    fields:
      reply:
        type: string
        required: true
decisions:
  topic:
    provider: typesafe
    model: jev-1.14.0
    type: choice
    instructions: Which part of the product is this question about
    criteria:
      product: A question about features, pricing, or usage
      billing: A question about an invoice or a refund
      off_topic: Anything unrelated
models:
  fast:
    provider: fake
    modelId: fake-echo
prompts:
  reply:
    version: 1
    model: fast
    template: "Reply about {{subject}}"
    variables:
      subject:
        type: string
        required: true
    output:
      kind: text
deployments:
  prod:
    target: serverless
    secrets: [FAKE_API_KEY]
pipelines:
  triage:
    description: Route the question to the arm its topic names.
    trigger:
      http:
        method: post
        path: /triage
    steps:
      - generate:
          prompt: reply
          input:
            subject: "How much does the pro plan cost"
          as: plan
      # Every label the decision can answer has an arm, so no `default` is declared and
      # the spec validator refuses one as unreachable. Both the mapped arms bind
      # `reply`, which is what makes the name sound for the step after the route.
      - route:
          decision: topic
          input: "{{plan}}"
          on:
            product:
              - generate:
                  prompt: reply
                  input:
                    subject: "{{plan}}"
                  as: reply
            billing:
              - generate:
                  prompt: reply
                  input:
                    subject: "{{plan}}"
                  as: reply
            off_topic:
              - generate:
                  prompt: reply
                  input:
                    subject: "This request was off topic"
                  as: reply
          as: path
      - emit:
          event: Answer
