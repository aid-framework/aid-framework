specVersion: "0.2"
project:
  name: handbook
  namespace: acme.handbook
  description: Answers handbook questions from reranked passages, guarded and triaged.
  targets: [py-fastapi]
types:
  Answer:
    kind: struct
    fields:
      text:
        type: string
        required: true
      citations:
        type: string[]
        required: true
models:
  answer:
    provider: openai
    modelId: gpt-4o-mini
    apiKeyEnv: OPENAI_API_KEY
    capabilities: [json-schema]
    params:
      temperature: 0
      maxTokens: 512
  embed:
    provider: fake
    modelId: text-embedding-3-small
    capabilities: [embeddings]
stores:
  docs:
    kind: memory
    dimensions: 1536
retrievers:
  handbook:
    source:
      kind: file
      uri: ./docs
      glob: "**/*.md"
    chunking:
      strategy: recursive
      size: 800
      overlap: 100
      keepMetadata: [path]
    embedModel: embed
    store: docs
    index:
      metric: cosine
      hybrid: true
    topK: 5
    refresh:
      mode: full
    traits: [citations]
prompts:
  answer_from_handbook:
    version: 1
    model: answer
    template: |
      Answer the question from the handbook excerpts.

      Question: {{question}}
      Excerpts: {{context}}
    variables:
      question:
        type: string
        required: true
      context:
        type: string
        required: true
    output:
      kind: structured
      schema: Answer
  triage_instructions:
    version: 1
    model: answer
    template: "Summarise the answer's risk in one sentence. Never invent an order id."
    output:
      kind: text
guardrails:
  request_pii:
    stages: [input]
    policies: [pii-detect]
    action: block
    onFail:
      message: The question was rejected by the input guardrail.
      log: true
  passage_pii:
    stages: [retrieval]
    policies: [pii-detect]
    action: block
    onFail:
      message: The retrieved passages were rejected by the retrieval guardrail.
      log: true
  answer_pii:
    stages: [output]
    policies: [pii-detect]
    action: block
    onFail:
      message: The answer was rejected by the output guardrail.
      log: true
agents:
  triage_agent:
    name: Triage Agent
    instructions: triage_instructions
    model: answer
    maxSteps: 2
    maxTokensBudget: 2048
    engine: native
pipelines:
  answer_question:
    description: Retrieve, rerank, guard every end, answer, then triage the answer.
    trigger:
      http:
        method: post
        path: /answer
    steps:
      - guard:
          guardrail: request_pii
          stage: input
          text: "{{event.question}}"
      - retrieve:
          retriever: handbook
          query: "{{event.question}}"
          as: passages
      - rerank:
          over: passages
          query: "{{event.question}}"
          model: lexical
          topN: 3
          as: context
      - guard:
          guardrail: passage_pii
          stage: retrieval
          text: "{{ context }}"
      - generate:
          prompt: answer_from_handbook
          input:
            question: "{{event.question}}"
          context: context
          as: answer
      - guard:
          guardrail: answer_pii
          stage: output
          text: "{{ answer.text }}"
      - agent:
          agent: triage_agent
          text: "{{ answer.text }}"
          as: triage
      - emit:
          event: Answer
evals:
  answer_quality:
    description: Ranking quality and answer accuracy for the handbook retriever.
    target: pipeline:answer_question
    dataset:
      source: file
      uri: datasets/handbook.jsonl
    metrics:
      - kind: retrieval
        expectDocs: [getting-started.md]
        k: 3
      - kind: exact
        field: text
    gate:
      ci: true
      maxRegression: 0.05
      samples: 3