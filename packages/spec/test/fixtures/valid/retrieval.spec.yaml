specVersion: "0.1"

project:
  name: handbook-answers
  namespace: aid.examples.handbook
  description: Answers handbook questions from retrieved documentation excerpts.
  targets:
    - py-fastapi

types:
  Answer:
    kind: struct
    fields:
      text:
        type: string
        required: true
      citations:
        type: string[]
        required: true

models:
  answer:
    provider: openai
    modelId: gpt-4o-mini
    apiKeyEnv: OPENAI_API_KEY
    capabilities: [json-schema]
    params:
      temperature: 0
      maxTokens: 512
  embed:
    provider: fake
    modelId: text-embedding-3-small
    capabilities: [embeddings]
  rerank:
    provider: fake
    modelId: fake-lexical-rerank

stores:
  docs:
    kind: memory
    dimensions: 1536
  docs_pg:
    kind: pgvector
    uri: env:PGVECTOR_URL
    dimensions: 1536

retrievers:
  handbook:
    source:
      kind: file
      uri: ./docs
      glob: "**/*.md"
    chunking:
      strategy: recursive
      size: 800
      overlap: 100
      keepMetadata: [path]
    embedModel: embed
    store: docs
    index:
      metric: cosine
      hybrid: true
    topK: 5
    rerank:
      model: rerank
      topN: 3
    refresh:
      mode: full
    traits: [citations]

prompts:
  answer_question:
    version: 1
    model: answer
    template: |
      Answer the question using only the handbook excerpts below.

      Question: {{ question }}
      Excerpts: {{ context }}
    variables:
      question:
        type: string
        required: true
      context:
        type: string
        required: true
    output:
      kind: structured
      schema: Answer

evals:
  answer_quality:
    description: Retrieval ranking and answer accuracy for the handbook pipeline.
    target: pipeline:answer
    dataset:
      source: file
      uri: evals/answer_quality.jsonl
    metrics:
      - kind: retrieval
        expectDocs: [getting-started.md]
        k: 3
      - kind: exact
        field: text
    gate:
      ci: true
      maxRegression: 0.05
      samples: 5

pipelines:
  answer:
    description: Retrieve handbook excerpts, then answer from them with citations.
    trigger:
      http:
        method: post
        path: /answer
    steps:
      - retrieve:
          retriever: handbook
          query: "{{ question }}"
          as: context
      - generate:
          prompt: answer_question
          input:
            question: "{{ question }}"
          context: context
          as: answer
      - emit:
          event: Answer
