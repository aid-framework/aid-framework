specVersion: "0.19"

project:
  name: incremental-knowledge
  namespace: aid.examples.incremental
  description: Reconciles a local index with its source instead of rebuilding it from scratch.
  targets:
    - py-fastapi

models:
  embed:
    provider: fake
    modelId: text-embedding-3-small
    capabilities: [embeddings]

stores:
  docs:
    kind: memory
    dimensions: 1536

retrievers:
  knowledge:
    source:
      kind: file
      uri: ./docs
      glob: "**/*.md"
    chunking:
      strategy: recursive
      size: 800
      overlap: 100
    embedModel: embed
    store: docs
    index:
      metric: cosine
    topK: 5
    refresh:
      mode: incremental
