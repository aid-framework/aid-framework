specVersion: "0.21"

project:
  name: probe

retrievers:
  knowledge:
    source:
      kind: http
      uri: https://handbook.example.com/guides/pricing.md
      glob: "**/*.md"
    chunking:
      strategy: recursive
      size: 800
      overlap: 100
    embedModel: embed
    store: docs
    index:
      metric: cosine
    topK: 5
    refresh:
      mode: full
