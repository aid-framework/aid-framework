# Fast feedback only; CI is the gate.
#
# These hooks check the staged files they are given, nothing else, so a green commit says
# nothing about the docs build, the Python suites or the generated fixtures. `pnpm check`
# runs what this machine can run of CI's checks and prints what it could not; `pnpm check:all`
# refuses to skip. `CONTRIBUTING.md` has the opt-in pre-push hook that runs the former.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,mts,cts,js,mjs,cjs,json,jsonc,yaml,yml}'
      run: pnpm exec biome check --error-on-warnings --no-errors-on-unmatched --staged
    markdownlint:
      glob: '*.md'
      run: pnpm exec markdownlint-cli2 {staged_files}
    config:
      glob: '*.json'
      run: node scripts/check-config.mjs
    workflows:
      glob: '.github/workflows/*.yml'
      run: node scripts/check-workflows.mjs

skip_output:
  - execution_out
  - execution_info
