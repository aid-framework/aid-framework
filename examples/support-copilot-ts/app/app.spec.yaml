specVersion: "0.2"

# The second target of the same application as `examples/support-copilot`.
#
# The two examples differ by *target*, not by domain: the types, the models and their
# fallback, the retriever over the same two-document corpus, the prompt, the business tool
# and both evals are the same declarations. That is the point of keeping both -- the same
# IR, compiled by two generators, is what makes their goldens comparable and what keeps
# the shared contract honest.
#
# They differ in how far each target has been carried, and this file records that rather
# than hiding it: it is `specVersion: "0.2"` because this is the target that emits the 0.2
# sections. `guardrails`, `memory`, `agents` and `deployments` are all declared here and
# all emitted; the py example has no counterpart for them yet. Where the two share a
# construct the declaration is the same line for line.
#
# What changes is only what the target requires:
#   * `targets: [ts-vercel]` -- the registry entry that compiles this spec.
#   * the comments that named Python modules now name the TypeScript ones, because a
#     comment describing a file the generator does not emit is a lie in a golden.

project:
  name: support-copilot-ts
  namespace: aid.examples.support
  description: Classifies an inbound support ticket and answers it with a structured reply.
  targets:
    - ts-vercel

types:
  Ticket:
    kind: struct
    fields:
      subject:
        type: string
        required: true
        description: The ticket subject line.
      body:
        type: string
        required: true
        description: The ticket body, as the customer wrote it.
  Customer:
    kind: struct
    fields:
      id:
        type: string
        required: true
        description: The account identifier.
      name:
        type: string
        required: true
        description: The account name, for the reply to address.
      plan:
        type: string
        required: true
        enum: [free, pro, enterprise]
      open_tickets:
        type: integer
        required: true
        minimum: 0
        description: How many tickets the account already has open.
  Answer:
    kind: struct
    fields:
      summary:
        type: string
        required: true
        description: One sentence describing what the customer is asking for.
      category:
        type: string
        required: true
        enum: [billing, bug, howto, other]
      confidence:
        type: number
        required: true
        minimum: 0
        maximum: 1
  # The shape the triage pipeline emits. A second type rather than a field on `Answer`,
  # because the two routes answer different questions: `answer_ticket` classifies one
  # ticket, `triage` reports what it did with it.
  Triage:
    kind: struct
    fields:
      summary:
        type: string
        required: true
        description: The classification the pipeline settled on.
      note:
        type: string
        required: true
        description: The agent's one-line note about the ticket.

models:
  fast:
    provider: openai
    modelId: gpt-4o-mini
    apiKeyEnv: OPENAI_API_KEY
    capabilities: [json-schema, tools]
    params:
      temperature: 0.2
      maxTokens: 512
    costProfile: openai-gpt-4o-mini
    limits:
      maxInputTokens: 8192
      maxOutputTokens: 512
    fallbacks: [offline]
  # The fallback is the fake provider, so the example runs end to end with no network
  # and no key -- the emitted gateway falls back to it when the primary has no key. The
  # eval gate samples against this one.
  offline:
    provider: fake
    modelId: fake-deterministic-1
    capabilities: [json-schema, tools]
    # A stand-in is still priced. The native agent loop enforces `maxCostBudget`, and
    # `fromIr` refuses a model whose closure resolves no cost profile -- "a budget cannot
    # be enforced against an unpriced model" -- so the fake provider carries the rate of
    # the model it stands in for. It is reachable from the agent through `fast`'s
    # fallback, which is what makes it part of the set the agent route parses.
    costProfile: openai-gpt-4o-mini
  # Retrieval is wired with the same discipline: a deterministic fake embedder, so the
  # whole path -- chunk, embed, index, search, cite -- runs in CI with no network and no
  # key. The `embeddings` capability is what makes this model an embedding model; the IR
  # has no `embeddings` section, an entry exists per model that declares it.
  #
  # `modelId` names the catalogued model rather than an invented id, which is what lets
  # the cost gate price the chunks a retriever materialises: a profile resolves from the
  # pinned catalog by `modelId`, and an id the catalog does not know leaves the eval
  # unpriced.
  embed:
    provider: fake
    modelId: text-embedding-3-small
    capabilities: [embeddings]
  # The runtime's `rerankerFor` matches "lexical" against the name the IR carries, which
  # is this alias rather than `modelId`, so the alias is what has to say it.
  lexical:
    provider: fake
    modelId: fake-lexical-rerank

stores:
  handbook:
    # In memory, exactly as in the py-fastapi example: the example indexes a two-file
    # corpus on ingest and searches it in process. The generator also emits the
    # `pgvector` binding when the spec declares `kind: pgvector` -- it is the vector
    # store this target is designed around -- but wiring one here would make the example
    # unrunnable without a PostgreSQL, and no required gate may touch a database.
    kind: memory
    # The vector width. A retriever must fix one -- from its embedding or its store --
    # because a width resolved at run time would let a store accept vectors a later run
    # cannot compare.
    dimensions: 1536

retrievers:
  handbook:
    source:
      kind: file
      uri: ./docs
      glob: "**/*.md"
    chunking:
      strategy: recursive
      size: 800
      overlap: 100
      keepMetadata: [path]
    embedModel: embed
    store: handbook
    index:
      metric: cosine
      hybrid: true
    topK: 5
    rerank:
      model: lexical
      topN: 3
    refresh:
      mode: full
    traits: [citations]

prompts:
  classify_ticket:
    version: 1
    model: fast
    template: |
      You classify inbound support tickets for the ACME support desk.

      Subject: {{ subject }}

      Handbook excerpts retrieved for the subject, or nothing when nothing matched.
      {{ handbook }}

      Answer with a JSON object holding exactly three fields:
        * summary: one sentence describing the customer's problem
        * category: one of billing, bug, howto, other
        * confidence: your confidence in the category, a number between 0 and 1
    variables:
      subject:
        type: string
        required: true
      # The variable the `retrieve` step's binding feeds. Its name matches that binding
      # (`as: handbook`) because the generated call inlines the retrieved context under
      # it, and it is `required: true` because the template interpolates it: the prompt
      # registry rejects both an unsupplied variable and a supplied-but-unused one, so a
      # binding the body never interpolates would raise on the first request.
      handbook:
        type: string
        required: true
    output:
      kind: structured
      schema: Answer
  # The agent's system message. It declares no variables because the agent loop never
  # renders any: `fromIr` reads the template verbatim, so a `{{ name }}` here would reach
  # the model as braces. The validator refuses that rather than emitting it.
  triage_instructions:
    version: 1
    model: fast
    template: |
      You are the ACME support desk's triage assistant. Read the classified ticket and
      write one sentence a human agent can act on. Do not repeat the summary verbatim.
    output:
      kind: text

# The collection the runtime executes and this target now emits. `input` is required by
# the security gate because caller text reaches a prompt on an HTTP `generate` route;
# `output` is what makes the generate step emit its output check, and it is the stage the
# `guard` step below names.
guardrails:
  inbound:
    stages: [input, output]
    policies: [pii-detect]
    action: block
    onFail:
      message: The request was refused by a guardrail.
      log: true

# A thread-scoped buffer: the agent's conversation, bounded by tokens rather than by
# turns. `summarizeModel`, `ttl` and `backend` are refused at plan time because the
# runtime implements none of them, and a declaration nothing honours is a lie.
memory:
  triage_thread:
    kind: buffer
    scope: thread
    tokenBudget: 2048

agents:
  triage_agent:
    name: Triage
    instructions: triage_instructions
    model: fast
    tools: [lookup_customer]
    guardrails: [inbound]
    memory: [triage_thread]
    maxSteps: 3
    maxCostBudget: 0.05

tools:
  lookup_customer:
    description: Look up the account that filed a ticket.
    input: Ticket
    output: Customer
    handler:
      kind: business
      symbol: lookup_customer
    sideEffects: read
    timeoutMs: 5000
    retries: 1
    idempotency: key
    # No `auth:` predicate here on purpose: the runtime has no authorization hook yet,
    # so `hasScope("customers:read")` would be an unenforced claim. Both generators
    # refuse to emit one rather than let the spec imply a check nothing performs.

evals:
  classify_quality:
    description: Whether the classifier returns a well-formed answer for each ticket.
    target: pipeline:answer_ticket
    dataset:
      source: file
      uri: evals/classify_quality.json
    metrics:
      - kind: json-schema
        schema: Answer
    gate:
      # `ci: true` is what makes this a gate rather than a report.
      ci: true
      maxRegression: 0.05
      samples: 5
  # Retrieval is measured by a *different* harness, which is why this is a second eval
  # rather than a second metric on the one above: this one samples the retriever and
  # scores ranked, cited results, so the generated module builds a `RetrievalGate`.
  handbook_quality:
    description: Whether retrieval finds the handbook pages a ticket's subject needs.
    target: pipeline:answer_ticket
    dataset:
      source: file
      uri: evals/handbook_quality.json
    metrics:
      # `expectDocs` are the documents the retriever's own ids name. A document id is its
      # path relative to the retriever's `uri` (`./docs`), which is why these are bare
      # filenames rather than `docs/billing.md`; a run whose index is empty reports 0.0
      # for every one of them. `k` is how many results count as an answer.
      - kind: retrieval
        expectDocs: [billing.md, exports.md]
        k: 5
    gate:
      ci: true
      maxRegression: 0.05
      samples: 5
  # The triage route is served over HTTP, so the coverage gate wants a gate eval aimed at
  # it. It shares the classifier's metric because it answers the same question; what is
  # different is the schema the run must satisfy.
  triage_quality:
    description: Whether the triage pipeline answers with a well-formed triage report.
    target: pipeline:triage
    dataset:
      source: file
      uri: evals/triage_quality.json
    metrics:
      - kind: json-schema
        schema: Triage
    gate:
      ci: true
      maxRegression: 0.05
      samples: 5

pipelines:
  answer_ticket:
    description: Classify a ticket and return a structured answer.
    trigger:
      http:
        method: post
        path: /tickets/answer
    steps:
      - tool:
          tool: lookup_customer
          input:
            subject: "{{ event.subject }}"
            body: "{{ event.body }}"
          as: customer
      - retrieve:
          retriever: handbook
          query: "{{ event.subject }}"
          # The binding name. It is also the prompt variable the retrieved context is
          # inlined under, so the two are written to agree.
          as: handbook
      - generate:
          prompt: classify_ticket
          input:
            subject: "{{ event.subject }}"
          context: handbook
          as: answer
      - emit:
          event: Answer

  # Every step kind this target emits, in one runnable pipeline. It exists to be executed,
  # not read: `scripts/e2e-example-ts.mjs` posts to it, so an emitter that produced code
  # which compiled but did not run would fail there rather than only in a unit test.
  triage:
    description: Classify a ticket, fold the handbook evidence, and have an agent note it.
    trigger:
      http:
        method: post
        path: /tickets/triage
    steps:
      - tool:
          tool: lookup_customer
          input:
            subject: "{{ event.subject }}"
            body: "{{ event.body }}"
          as: customer
      - retrieve:
          retriever: handbook
          query: "{{ event.subject }}"
          as: handbook
      # `rerank` binds a shorter, reordered list. The runtime matches "lexical" against
      # the model alias, which is why `lexical` is declared with that name.
      - rerank:
          over: handbook
          query: "{{ event.subject }}"
          model: lexical
          topN: 3
          as: ranked
      - generate:
          prompt: classify_ticket
          input:
            subject: "{{ event.subject }}"
          context: handbook
          as: answer
      # A single named guardrail at one stage, as opposed to the stage-wide tables the
      # route runs: the `guard` step is how a pipeline checks one declaration in place.
      - guard:
          guardrail: inbound
          stage: output
          text: "{{ answer.summary }}"
      - branch:
          when: 'hasRole("admin")'
          then:
            - generate:
                prompt: classify_ticket
                input:
                  subject: "{{ event.subject }}"
                context: handbook
                as: escalated
          else:
            - generate:
                prompt: classify_ticket
                input:
                  subject: "{{ event.subject }}"
                context: handbook
                as: escalated
      - parallel:
          branches:
            - - generate:
                  prompt: classify_ticket
                  input:
                    subject: "{{ event.subject }}"
                  context: handbook
                  as: left
            - - generate:
                  prompt: classify_ticket
                  input:
                    subject: "{{ event.subject }}"
                  context: handbook
                  as: right
      # `map` and `reduce` are absent on purpose. Both iterate `over`, a *binding name*,
      # and this language has no construct that binds a list: `tool` and `generate` bind a
      # declared struct, `retrieve`/`rerank` bind a retrieval result, `agent` binds a
      # string, and `event` is the request object. The runtime's composites are exercised
      # by the conformance corpus, which seeds the list directly, but a spec-derived app
      # cannot reach them today. The emitter emits both anyway; see the PR body.
      - agent:
          agent: triage_agent
          text: "{{ answer.summary }}"
          as: note
      - emit:
          event: Triage

# `concurrency` is a gate on the composites: without a cap the emitted fan-out would be
# unbounded, so the planner refuses a composite rather than guessing a limit.
deployments:
  api:
    target: container
    concurrency: 4
    secrets: []
