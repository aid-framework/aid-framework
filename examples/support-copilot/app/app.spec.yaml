specVersion: "0.2"

# The example app: the smallest spec that still exercises every contract the
# py-fastapi target emits -- a model gateway with a pinned model and a fallback, a
# prompt the registry serves, a business tool behind a generated adapter, a structured
# output, an HTTP route, a retriever over a local corpus with citations, an ingest
# entry point, an input guardrail, a streaming deployment, an eval that gates on a
# statistical threshold, and an agent route with a memory tier, a confirmation step and
# the resume route those imply.

project:
  name: support-copilot
  namespace: aid.examples.support
  description: Classifies an inbound support ticket and answers it with a structured reply.
  targets:
    - py-fastapi

types:
  Ticket:
    kind: struct
    fields:
      subject:
        type: string
        required: true
        description: The ticket subject line.
      body:
        type: string
        required: true
        description: The ticket body, as the customer wrote it.
  Customer:
    kind: struct
    fields:
      id:
        type: string
        required: true
        description: The account identifier.
      name:
        type: string
        required: true
        description: The account name, for the reply to address.
      plan:
        type: string
        required: true
        enum: [free, pro, enterprise]
      open_tickets:
        type: integer
        required: true
        minimum: 0
        description: How many tickets the account already has open.
  Answer:
    kind: struct
    fields:
      summary:
        type: string
        required: true
        description: One sentence describing what the customer is asking for.
      category:
        type: string
        required: true
        enum: [billing, bug, howto, other]
      confidence:
        type: number
        required: true
        minimum: 0
        maximum: 1
  Refund:
    kind: struct
    fields:
      subject:
        type: string
        required: true
        description: The ticket the refund is for.
      amount:
        type: number
        required: true
        minimum: 0
        description: How much to refund, in the account's currency.
  RefundReceipt:
    kind: struct
    fields:
      refund_id:
        type: string
        required: true
        description: The identifier the billing system assigned.
      status:
        type: string
        required: true
        enum: [issued, declined]

models:
  fast:
    provider: openai
    modelId: gpt-4o-mini
    apiKeyEnv: OPENAI_API_KEY
    capabilities: [json-schema, tools, streaming]
    params:
      temperature: 0.2
      maxTokens: 512
    costProfile: openai-gpt-4o-mini
    limits:
      maxInputTokens: 8192
      maxOutputTokens: 512
    fallbacks: [offline]
  # The fallback is the fake provider, so the example runs end to end with no network
  # and no key. The eval gate samples against this one.
  offline:
    provider: fake
    modelId: fake-deterministic-1
    capabilities: [json-schema, tools, streaming]
  # Retrieval is wired with the same discipline: a deterministic fake embedder, so the
  # whole path -- chunk, embed, index, search, cite -- runs in CI with no network and no
  # key. The `embeddings` capability is what makes this model an embedding model; the IR
  # has no `embeddings` section, an entry exists per model that declares it.
  #
  # `modelId` names the catalogued model rather than an invented id, which is what lets
  # the cost gate price the chunks a retriever materialises: a profile resolves from the
  # pinned catalog by `modelId`, and an id the catalog does not know leaves the eval
  # unpriced. This mirrors `packages/spec/test/fixtures/valid/retrieval.spec.yaml`, the
  # offline retrieval fixture the spec layer ships.
  embed:
    provider: fake
    modelId: text-embedding-3-small
    capabilities: [embeddings]
  # The runtime's `reranker_for` matches "lexical" against the name the IR carries, which
  # is this alias rather than `modelId`, so the alias is what has to say it.
  lexical:
    provider: fake
    modelId: fake-lexical-rerank
  # The agent route gets its own model, and this is the shortest way to say why. The agent
  # runtime resolves the document it is handed with `from_ir`, which builds a spec for
  # *every* model in that document and refuses one that resolves no `costProfile` -- "a
  # budget cannot be enforced against an unpriced model". `fast` is priced, but its
  # `offline` fallback is not: the pinned catalog knows no price for the fake provider, so
  # a fallback chain is exactly what the agent document cannot carry. `triage` therefore
  # declares no fallbacks, and the generator refuses an agent whose model reaches an
  # unpriced model rather than dropping the fallback behind the reader's back. The pipeline
  # keeps its own `fast` -> `offline` chain, on the gateway config it generates for itself.
  triage:
    provider: openai
    modelId: gpt-4o-mini
    apiKeyEnv: OPENAI_API_KEY
    capabilities: [json-schema, tools, streaming]
    params:
      temperature: 0
      maxTokens: 400
    costProfile: openai-gpt-4o-mini
    limits:
      maxInputTokens: 8192
      maxOutputTokens: 400

stores:
  handbook:
    # In memory: the example indexes a two-file corpus on ingest and searches it in
    # process. The pgvector adapter path ships with the runtime and a compose file ships
    # beside it (design §D2); wiring one here would make the example unrunnable without a
    # PostgreSQL, and no required gate may touch a database.
    kind: memory
    # The vector width. A retriever must fix one -- from its embedding or its store --
    # because a width resolved at run time would let a store accept vectors a later run
    # cannot compare.
    dimensions: 1536

retrievers:
  handbook:
    source:
      kind: file
      uri: ./docs
      glob: "**/*.md"
    chunking:
      strategy: recursive
      size: 800
      overlap: 100
      keepMetadata: [path]
    embedModel: embed
    store: handbook
    index:
      metric: cosine
      hybrid: true
    topK: 5
    rerank:
      model: lexical
      topN: 3
    refresh:
      mode: full
    traits: [citations]

prompts:
  classify_ticket:
    version: 1
    model: fast
    template: |
      You classify inbound support tickets for the ACME support desk.

      Subject: {{ subject }}

      Handbook excerpts retrieved for the subject, or nothing when nothing matched.
      {{ handbook }}

      Answer with a JSON object holding exactly three fields:
        * summary: one sentence describing the customer's problem
        * category: one of billing, bug, howto, other
        * confidence: your confidence in the category, a number between 0 and 1
    variables:
      subject:
        type: string
        required: true
      # The variable the `retrieve` step's binding feeds. Its name matches that binding
      # (`as: handbook`) because the generated call inlines the retrieved context under
      # it, and it is `required: true` because the template interpolates it: the prompt
      # registry rejects both an unsupplied variable and a supplied-but-unused one, so a
      # binding the body never interpolates would raise on the first request.
      handbook:
        type: string
        required: true
    output:
      kind: structured
      schema: Answer
  # The agent's instructions, and the second thing `from_ir` makes you notice: the loop
  # reads `prompts[].template` and never renders variables, so a prompt an agent uses has
  # to be variable-free. The generator refuses one that is not, because otherwise the
  # model would receive the literal text `{{ subject }}`.
  ticket_agent_prompt:
    version: 1
    model: triage
    template: |
      You are the ACME support desk's refund agent.

      You have two tools. `lookup_customer` returns the account that filed a ticket;
      `issue_refund` moves money, and a person has to approve it before it runs.

      Look the account up before you propose a refund, refund no more than once per
      subject, and answer in one or two sentences once the refund is issued or declined.
    output:
      kind: text

tools:
  lookup_customer:
    description: Look up the account that filed a ticket.
    input: Ticket
    output: Customer
    handler:
      kind: business
      symbol: lookup_customer
    sideEffects: read
    timeoutMs: 5000
    retries: 1
    idempotency: key
    # A read tool needs no `auth:` and must not pretend to one: the pipeline route has no
    # authorization hook, so `hasScope("customers:read")` here would be a check nothing
    # performs. A `write` tool is the different case below, where the agent loop really
    # does evaluate the policy before the call.
  issue_refund:
    description: Issue a refund against the account that filed a ticket.
    input: Refund
    output: RefundReceipt
    handler:
      kind: business
      symbol: issue_refund
    sideEffects: write
    # Required by the IR's security gate for any write, and honoured only on the agent
    # route: `AgentRuntime._authorize` evaluates this against the run's principal before
    # the call executes and denies a write that declares none. The pipeline route never
    # calls this tool, which is the condition under which the generator will emit an
    # `auth` at all -- so the declaration cannot become a promise the generate route
    # silently drops.
    #
    # `isAuthenticated()` rather than `hasRole("billing")` because this app has no auth
    # layer yet: the runtime's `Principal()` is the anonymous-but-authenticated caller,
    # so a role check here would deny every call and the example would ship a tool that
    # cannot run. Whoever adds authentication in Phase 3 narrows this to a role; the
    # generated route passes no principal, so anything narrower fails closed today.
    auth: isAuthenticated()
    # The other field only an agent route can honour. `_needs_approval` pauses the run
    # before this tool is called and hands the caller a checkpoint; a pipeline step has no
    # confirmation step between it and the tool, so the generator refuses the flag on any
    # tool a pipeline step calls, and the TypeScript target refuses it outright.
    requiresConfirmation: true
    timeoutMs: 5000
    idempotency: key

guardrails:
  # Where these run is two different places, and adding an agent is what made the
  # difference visible. The generated generate route calls
  # `ENGINE.check_input(INPUT_GUARDRAILS, <the rendered prompt>)` inline, and
  # `INPUT_GUARDRAILS` is *every* guardrail in this document with `input` in `stages` --
  # so the pipeline route runs all of them whether or not it names them, which is what
  # "the security gate is document-global" means in practice.
  #
  # The agent route is not that. It runs `agent.guardrails`: the ones its agent names, at
  # the stages each declares. So `refund_agent` below names `ticket_intake` and is
  # inspected by it, and an agent that named nothing would be inspected by nothing -- a
  # guardrail declared here reaches an agent only because the agent lists it. The two can
  # disagree in both directions, and both are deliberate: `ticket_pii` is declared here,
  # runs on the generate route, and no agent names it, so the agent route never sees it.
  #
  # `refund_args` below is the case where the disagreement is the point. Because the
  # generate route enforces exactly the `input`-stage table, a guardrail with no `input`
  # stage is unreachable from it -- which is what makes `action: escalate` legal there and
  # illegal on any input-stage guardrail.
  ticket_intake:
    stages: [input]
    policies: [prompt-injection]
    action: block
    onFail:
      # `message` is the text the 400 carries, and the reason a client can tell a refusal
      # from a failure: a block is a decision, not an outage, so it is a 4xx.
      message: This ticket reads as an attempt to redirect the assistant, so it was refused.
      log: true
  ticket_pii:
    stages: [input]
    policies: [pii-detect]
    action: redact
    # The input stage's payload is exactly `{"text": <the rendered prompt>}`, so `text`
    # is the only field name a redaction can mask there. The generator refuses any other
    # name rather than emit a redaction that could never run.
    redact: [text]
    onFail:
      message: Contact details in the ticket were masked before the model saw them.
      log: false
  refund_args:
    # No `input` stage, and that is load-bearing rather than incidental. The generate route
    # enforces every input-stage guardrail in the document, so an `escalate` here would ask
    # the pipeline a question it can never be answered on -- the generator refuses that. At
    # the `tool-call` stage only the agent loop reaches it, and only because the agent names
    # it, so escalation has a checkpoint to hand back and a route to resume from.
    #
    # This is also what the IR's coverage gate requires of `issue_refund`, the one tool here
    # with `sideEffects: write`: a write must reach a stage that can inspect the call before
    # it happens, and naming no `tools` makes this one cover every tool.
    stages: [tool-call]
    policies: [secret-scan]
    action: escalate
    onFail:
      message: A refund call carried something that looks like a credential, so it was held.
      log: true

memory:
  # One tier, and the only kind the runtime implements today: `buffer` and `window` are
  # `IMPLEMENTED_MEMORY_KINDS`, and the generator refuses the other four by name instead
  # of accepting a tier that would be ignored. No `backend` or `store` either -- a
  # generated app registers no `MemoryStore`, so `_store_for` serves the in-process default
  # and any other backend would raise on the first write.
  ticket_thread:
    kind: buffer
    scope: thread
    tokenBudget: 2000

agents:
  refund_agent:
    name: Refund agent
    instructions: ticket_agent_prompt
    model: triage
    tools: [lookup_customer, issue_refund]
    memory: [ticket_thread]
    # Named rather than inherited: see the comment on `guardrails` above. This is what makes
    # the same injection check run on the agent route as on the generate route, and what
    # puts `refund_args` in front of every tool call the agent makes.
    guardrails: [ticket_intake, refund_args]
    maxSteps: 6
    maxCostBudget: 0.05
    # `true` is a closed policy expression, so every run asks before it issues a refund.
    # The checkpoint the paused run returns is what `POST /agents/resume` takes back, and
    # the route exists because this agent can pause -- as it also would if it declared no
    # approval at all and only named a confirming tool, or escalated from a guardrail.
    humanInTheLoop:
      when: "true"
      channel: refunds

evals:
  classify_quality:
    description: Whether the classifier returns a well-formed answer for each ticket.
    # The spec language names an eval's target as `pipeline:<id>`, and a pipeline counts
    # as one subject only when a single prompt is rendered against a single model.
    target: pipeline:answer_ticket
    dataset:
      source: file
      uri: evals/classify_quality.json
    metrics:
      - kind: json-schema
        schema: Answer
    gate:
      # `ci: true` is what makes this a gate rather than a report. An `llm-judge` metric
      # is deliberately absent: the spec layer refuses one under a CI gate, and design
      # §11 defers it, so the app's gate measures only what the runtime can compute
      # deterministically.
      ci: true
      maxRegression: 0.05
      samples: 5
  # Retrieval is measured by a *different* harness, which is why this is a second eval
  # rather than a second metric on the one above. `classify_quality` asks whether the
  # classifier shaped an answer well -- one prediction per case, through the model --
  # and this asks whether the handbook returned the pages that answer the ticket -- one
  # ranked, cited result per case, through the retriever. The runtime samples the second
  # question with `RetrievalGate`, which produces its own metrics, so an eval that asked
  # both would have to be measured twice and reported once; the generator refuses that
  # combination rather than silently dropping half of it.
  handbook_quality:
    description: Whether retrieval finds the handbook pages a ticket's subject needs.
    target: pipeline:answer_ticket
    dataset:
      source: file
      uri: evals/handbook_quality.json
    metrics:
      # `expectDocs` are the documents the retriever's own ids name. A document id is its
      # path relative to the retriever's `uri` (`./docs`), which is why these are bare
      # filenames rather than `docs/billing.md`; a run whose index is empty reports 0.0
      # for every one of them. `k` is how many results count as an answer.
      #
      # One `retrieval` metric covers the whole question: the runtime answers it with the
      # family of measurements it ships -- recall@k, MRR and citation grounding -- and the
      # generated gate is built from those metric objects, so no name written here can
      # drift from a name the runtime no longer produces.
      - kind: retrieval
        expectDocs: [billing.md, exports.md]
        k: 5
    gate:
      ci: true
      maxRegression: 0.05
      samples: 5

pipelines:
  answer_ticket:
    description: Classify a ticket and return a structured answer.
    trigger:
      http:
        method: post
        path: /tickets/answer
    steps:
      - tool:
          tool: lookup_customer
          input:
            subject: "{{ event.subject }}"
            body: "{{ event.body }}"
          as: customer
      - retrieve:
          retriever: handbook
          query: "{{ event.subject }}"
          # The binding name. It is also the prompt variable the retrieved context is
          # inlined under, so the two are written to agree.
          as: handbook
      - generate:
          prompt: classify_ticket
          input:
            subject: "{{ event.subject }}"
          context: handbook
          as: answer
      - emit:
          event: Answer

deployments:
  # A deployment says where the app runs, not how it is generated. `streaming` is the only
  # field here that reaches generated code: it makes the route answer a request that
  # accepts `text/event-stream` with the model's deltas as SSE frames, and it is what
  # makes the target declare the `streaming` capability. `secrets` names what the platform
  # must supply -- the process reads them from its own environment, so there is nothing for
  # the generator to emit for them.
  api:
    target: container
    streaming: true
    secrets: [OPENAI_API_KEY]
