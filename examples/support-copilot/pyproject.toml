[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-copilot-example"
version = "0.1.0"
description = "The AID Framework example app: a support-ticket classifier generated by @aid-framework/generator-py-fastapi."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The AID Framework authors" }]
# The generated app depends on the runtime for every behaviour it has -- the
# gateway, the prompt registry, the tool executor, the pipeline, the eval gate.
# Nothing else is needed: orchestration is plain async, so there is no graph
# library here.
dependencies = [
  "aid-runtime-python",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  # `fastapi.testclient.TestClient` is httpx-backed. The runtime depends on httpx
  # already, but the tests use it directly, so the example states its own need.
  "httpx>=0.27,<1",
  "mypy>=1.11,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

# `app/evals/` holds data, not code, so it travels with the `app` package.
[tool.setuptools.package-data]
app = ["evals/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
# `app` and `tests` are this example's own top-level packages, so they are
# first-party regardless of how the directories are laid out.
known-first-party = ["app", "tests"]

[tool.ruff.lint]
# The runtime's own selection, so the example is held to the same standard
# rather than to a weaker one of its own.
select = [
  "A",     # builtins shadowing
  "ANN",   # annotations
  "ASYNC", # async correctness
  "B",     # bugbear
  "C4",    # comprehensions
  "DTZ",   # naive datetimes
  "E",     # pycodestyle errors
  "ERA",   # commented-out code
  "F",     # pyflakes
  "I",     # import sorting
  "LOG",   # logging
  "N",     # pep8-naming
  "PT",    # pytest style
  "PTH",   # pathlib over os.path
  "RET",   # return simplification
  "RUF",   # ruff-specific
  "S",     # bandit
  "SIM",   # simplify
  "T20",   # no print()
  "TID",   # tidy imports
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
ignore = [
  # `Any` is unavoidable at the provider/tool boundary, where the payload is
  # shaped by the remote model rather than by us.
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# Generated code is emitted by the generator, never hand-edited. It reaches its
# siblings and parents through relative imports, and its eval module exposes a
# `main()` whose job is to print the gate summary for a CI log.
"app/generated/**" = [
  "TID252",
  "T201",
  "ANN001",
  "ANN201",
]
# The business seeds import the generated tree relatively for the same reason.
"app/business/**" = [
  "TID252",
]
"tests/**" = [
  "ANN001", # fixtures and test callables take untyped parameters
  "ANN201",
  "ANN202",
  "S101",   # assert is the point of a test
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# pydantic-ai ships type hints but no `py.typed` marker on every release line.
module = ["pydantic_ai.*"]
follow_untyped_imports = true
