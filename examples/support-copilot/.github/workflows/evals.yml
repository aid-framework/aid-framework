# Generated once by `aid gen` for the `py-fastapi` target, then yours.
# A scaffold file is never overwritten and never recorded in aid.manifest.json.
# Evals measure a real model, so this workflow needs the model credential; it runs
# on demand and nightly rather than on pull requests, which cannot hold a secret.
name: Evals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evals:
    name: Eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check the model credential
        id: creds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=0
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY is not set"
            missing=1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: classify_quality
        if: steps.creds.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m app.generated.evals.classify_quality
      - name: handbook_quality
        if: steps.creds.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m app.generated.evals.handbook_quality
      - name: Report a skipped gate
        if: steps.creds.outputs.ready != 'true'
        run: |
          echo "::error::The eval gate could not run: set OPENAI_API_KEY as a repository secret."
          exit 1
